<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Account — KJScale Admin</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/account/assets/css/dashboard.css">
  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="/">KJScale</a>
      <nav class="topnav">
        <a href="/">Home</a>
        <a href="/careers">Careers</a>
        <a href="#" id="signOutBtn" hidden>Sign Out</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-inner">
      <h1>Admin Dashboard — Applicants & Hiring</h1>
      <p class="subtitle">View incoming applications, manage hiring stages, and track performance — ready for Firebase.</p>
    </div>
  </section>

  <main class="container dashboard">
    <aside class="sidebar">
      <div class="panel">
        <h3>Filters</h3>
        <label>Search
          <input id="searchInput" type="search" placeholder="Search name, email, position">
        </label>
        <label>Status
          <select id="filterStatus">
            <option value="">All</option>
            <option>New</option>
            <option>Phone Screen</option>
            <option>Interview</option>
            <option>Offer</option>
            <option>Hired</option>
            <option>Rejected</option>
          </select>
        </label>
        <button id="refreshBtn" class="btn">Refresh</button>
        <button id="exportBtn" class="btn outline">Export CSV</button>
      </div>

      <div class="panel">
        <h3>Quick Actions</h3>
        <button id="bulkHireBtn" class="btn">Mark Selected as Hired</button>
        <button id="bulkRejectBtn" class="btn danger">Mark Selected as Rejected</button>
      </div>
    </aside>

    <section class="mainpanel">
      <div class="card tablecard">
        <div class="table-toolbar">
          <div>
            <label class="checkbox-inline"><input type="checkbox" id="selectAll"> Select</label>
          </div>
          <div>
            <span id="summaryCount">0 applicants</span>
          </div>
        </div>

        <div class="responsive-table">
          <table id="applicationsTable">
            <thead>
              <tr>
                <th></th>
                <th>Name</th>
                <th>Position</th>
                <th>Email</th>
                <th>Country</th>
                <th>Experience</th>
                <th>Status</th>
                <th>Rating</th>
                <th>Applied</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- Edit modal (hidden by default) -->
  <div id="editModal" class="modal" hidden>
    <div class="modal-body">
      <h3>Edit Candidate</h3>
      <form id="editForm">
        <input type="hidden" id="editId">
        <label>Full name<input id="editName" required></label>
        <label>Position<input id="editPosition" required></label>
        <label>Email<input id="editEmail" type="email" required></label>
        <label>Country<input id="editCountry"></label>
        <label>Experience<input id="editExperience"></label>
        <label>Status
          <select id="editStatus">
            <option>New</option>
            <option>Phone Screen</option>
            <option>Interview</option>
            <option>Offer</option>
            <option>Hired</option>
            <option>Rejected</option>
          </select>
        </label>
        <label>Rating (1-5)
          <input id="editRating" type="number" min="1" max="5">
        </label>
        <label>Notes<textarea id="editNotes" rows="4"></textarea></label>
        <div class="modal-actions">
          <button type="submit" class="btn">Save</button>
          <button type="button" id="closeModal" class="btn outline">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">&copy; <span id="year"></span> KJScale</div>
  </footer>

  <script src="/account/assets/js/firebase-config.js"></script>
  <script src="/account/assets/js/dashboard.js" defer></script>
</body>
</html>
